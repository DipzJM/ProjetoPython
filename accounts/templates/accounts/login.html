{% extends 'accounts/base.html' %}
{% load static %}
{% load socialaccount %}

{% block content %}
<h2>Login</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Entrar</button>
</form>
{% if mensagem %} <p style="color:red">{{ mensagem }}</p> {% endif %}

<hr>

<h3>Entra com Link Mágico</h3>

<form action="{% url 'accounts:send_magic_link' %}" method="POST">
    {% csrf_token %}
    <input type="email" name="email" placeholder="O teu e-mail" required>
    <button type="submit">Enviar Link por E-mail</button>
</form>

<hr>

<h3>Ou entra com a tua conta Google</h3>

<a href="{% provider_login_url 'google' next='/' %}" class="btn-google">
    <img src="https://developers.google.com/identity/images/g-logo.png"
         alt="Google" width="18" height="18" style="vertical-align: middle; margin-right: 8px;">
    Entrar com Google
</a>
{% endblock %}
